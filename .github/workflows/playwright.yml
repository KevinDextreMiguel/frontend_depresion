name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # NOTA: este workflow corre los E2E contra un backend YA DESPLEGADO
    # (staging), apuntado por PLAYWRIGHT_BASE_URL. No levanta FastAPI/Supabase
    # en el runner: ese backend depende de credenciales reales que no es
    # seguro ni reproducible arrancar aquí. Configura los secrets abajo antes
    # de habilitar este workflow.
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
      TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
      TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
      TEST_PSICOLOGO_EMAIL: ${{ secrets.TEST_PSICOLOGO_EMAIL }}
      TEST_PSICOLOGO_PASSWORD: ${{ secrets.TEST_PSICOLOGO_PASSWORD }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      TEST_ADMIN_SIGNUP_CODE: ${{ secrets.TEST_ADMIN_SIGNUP_CODE }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
